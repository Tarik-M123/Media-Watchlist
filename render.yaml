# Render Blueprint. In Render: New -> Blueprint -> pick this repo.
#
# region: frankfurt on the API and the database. The default is Oregon, which is
# ~150-200ms from Bosnia; Frankfurt is ~30ms, and every UI action here costs a
# request plus a refetch. Those two must match, because the API reaches Postgres
# over Render's internal network, and a region cannot be changed after creation.
# The static site takes no region — Render serves it from a global CDN.
#
# Two values cannot be set here because each service needs the other's URL and
# Render only assigns those at creation. After the first deploy, set them in the
# dashboard and redeploy both:
#
#   media-watchlist-api  ALLOWED_ORIGINS = https://<the static site URL>
#   media-watchlist-web  VITE_API_URL    = https://<the api URL>
#
# VITE_API_URL is inlined at build time, so the frontend must be rebuilt after
# setting it — a redeploy does that.

databases:
  - name: media-watchlist-db
    plan: free
    region: frankfurt
    databaseName: media_watchlist
    user: watchlist

services:
  - type: web
    name: media-watchlist-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    # Base.metadata.create_all runs at import, so the tables build themselves on
    # first boot. The numbered files in migrations/ are only needed for the
    # media_primary_poster view, which the API never reads.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: media-watchlist-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # never the repo's public fallback
      - key: ALLOWED_ORIGINS
        sync: false                  # set to the static site URL after deploy
      - key: TMDB_API_KEY
        sync: false                  # posters and title search; app runs without
      - key: GEMINI_API_KEY
        sync: false                  # assistant; panel explains itself without
      - key: WATCH_REGION
        value: BA
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: media-watchlist-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                  # set to the API URL after deploy
    routes:
      # Single-page app: every path must serve index.html or a refresh 404s.
      - type: rewrite
        source: /*
        destination: /index.html

  # n8n, deployed rather than run on a laptop. Two things make this work on a
  # free instance:
  #
  #   * Its state lives in Postgres (DB_TYPE=postgresdb), not on disk. Render's
  #     free filesystem is wiped on every restart — including every sleep/wake —
  #     so SQLite would lose the workflow and its credentials silently.
  #   * It reuses the app's database under its own `n8n` schema, because a
  #     workspace only gets one free Postgres. The schema must exist first:
  #         CREATE SCHEMA IF NOT EXISTS n8n;
  #
  # It still sleeps after 15 min idle, so the Sunday schedule is not reliable
  # here. Opening the UI wakes it and Execute Workflow runs on demand, which is
  # what a demo needs.
  - type: web
    name: n8n
    runtime: image
    plan: free
    region: frankfurt
    image:
      # Docker Hub, not docker.n8n.io — Render cannot fetch from n8n's own
      # registry mirror. Pinned to the version verified locally rather than
      # :latest, so a new n8n release cannot change behaviour mid-week.
      url: docker.io/n8nio/n8n:2.36.8
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: media-watchlist-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: media-watchlist-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: media-watchlist-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: media-watchlist-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: media-watchlist-db
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      # Must stay stable: it decrypts stored credentials. Change it and the
      # saved Postgres and SMTP credentials become unreadable.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: GENERIC_TIMEZONE
        value: Europe/Sarajevo
      - key: TZ
        value: Europe/Sarajevo
      # n8n binds N8N_PORT, not Render's PORT, so the two are pinned together.
      - key: N8N_PORT
        value: "10000"
      - key: PORT
        value: "10000"
