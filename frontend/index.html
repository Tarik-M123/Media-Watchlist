<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Watchlist</title>
    <script>
      // Applies the saved theme before first paint. Without this, React mounts a
      // frame later and every reload flashes the wrong theme. Key must match
      // THEME_KEY in components/ThemeToggle.jsx.
      ;(function () {
        try {
          var saved = localStorage.getItem('mw_theme')
          var dark = saved
            ? saved === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // Private mode can throw on localStorage; dark is the existing default.
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
